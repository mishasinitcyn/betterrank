[package]
name = "betterrank"
version = "0.5.6"
edition = "2021"
description = "Structural code index with PageRank-ranked repo maps, symbol search, call-graph queries, and ripgrep-backed non-code awareness."
license = "MIT"

[lib]
name = "betterrank"
path = "rs/lib.rs"

[[bin]]
name = "betterrank"
path = "rs/main.rs"

[dependencies]
blake3 = "1.5"
dirs = "5.0"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
libc = "0.2"
memchr = "2.7"
memmap2 = "0.9"
oxc_allocator = "0.159"
oxc_ast = "0.159"
oxc_ast_visit = "0.159"
oxc_parser = "0.159"
oxc_span = "0.159"
rayon = "1.10"
regex = "1.11"
rkyv = { version = "0.8", features = ["bytecheck"] }
rustc-hash = "2.1"
serde_json = "1.0"
streaming-iterator = "0.1"
tree-sitter = "0.24"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
